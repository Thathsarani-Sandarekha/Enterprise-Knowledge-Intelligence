
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: eki-postgres

    environment:
      POSTGRES_DB: eki
      POSTGRES_USER: eki
      POSTGRES_PASSWORD: local_only_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eki -d eki"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
