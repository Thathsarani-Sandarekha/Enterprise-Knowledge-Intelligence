name: Docker Container Build Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Docker build - ${{ matrix.component }}
        run: docker build --progress=plain -f ${{ matrix.component }}/Dockerfile -t asteria-${{ matrix.component }}:ci ${{ matrix.component }}
