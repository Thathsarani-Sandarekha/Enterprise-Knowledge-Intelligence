name: Backend and Frontend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-demo.txt
            backend/requirements-task3.txt
            backend/requirements-task4.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-demo.txt
      - name: Unit and security-contract tests (no provider calls)
        run: |
          python -m pytest -q \
            tests/test_task3_validation.py \
            tests/test_task3_excel.py \
            tests/test_task4_fusion.py \
            tests/test_task4_verification.py \
            tests/test_evaluation_metrics.py \
            tests/test_b2_security_contract.py \
            tests/test_b2_pii_redaction.py

  frontend-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Production build
        run: npm run build
